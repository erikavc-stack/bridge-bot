name: Bridge Tactico Telegram

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # 2 min después de cada cierre de 15m (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
    inputs:
      test:
        description: "Enviar mensaje de prueba con el estado actual"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bridge-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar mercado y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: "BTCUSDT,ETHUSDT"
          TIMEFRAMES: "15m,1h"   # GitHub no sirve para 1m-5m: esas las vigila el bot de tu PC
          COMMANDS: "0"          # los comandos (/radar, /winrate...) los contesta el bot de tu PC
          CAPITAL: "2000"
          RISK_PCT: "2"
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '' }}
        run: python bot.py

      - name: Guardar estado (evita avisos repetidos)
        run: |
          git config user.name "bridge-bot"
          git config user.email "bridge-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "estado" && git push)
